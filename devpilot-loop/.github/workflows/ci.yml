name: DevPilot Loop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff black mypy
      - run: ruff check devpilot-loop/
      - run: black --check devpilot-loop/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r devpilot-loop/requirements.txt
      - run: python -m pytest devpilot-loop/tests/ -v --tb=short
      - run: python -m pytest devpilot-loop/tests/ --cov=devpilot-loop/skills --cov-report=xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit safety semgrep
      - run: bandit -r devpilot-loop/skills/ -f json -o security-report.json
      - run: semgrep --config auto devpilot-loop/skills/

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f devpilot-loop/poc/deploy/docker-compose.yml config --quiet

  evidence:
    name: Evidence Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Verifying evidence integrity..."
          python3 -c "
          import os, json
          count = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git']]
              for f in files:
                  if 'evidence' in root or 'open-agent-audit' in root:
                      if f not in ['EVIDENCE-INDEX.md', 'README.md']:
                          count += 1
          print(f'Evidence files: {count}')
          assert count >= 90, f'Expected 90+ evidence files, got {count}'
          print('Evidence count: PASS')
          "
