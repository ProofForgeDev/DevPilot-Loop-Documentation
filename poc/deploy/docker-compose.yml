  worker-knowledge:
    build:
      context: ../..
      dockerfile: poc/deploy/Dockerfile.worker
    image: devpilot/worker:latest
    container_name: devpilot-worker-knowledge
    ports:
      - "8006:8006"
    volumes:
      - ./agents/knowledge:/agents/knowledge:ro
      - ./skills:/skills:ro
      - ./data/worker-knowledge:/data
    environment:
      AGENT_TYPE: worker
      AGENT_NAME: knowledge
      MANAGER_URL: http://manager:8008
      MATRIX_HOMESERVER: http://synapse:8008
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: devpilot
      MINIO_PASSWORD: devpilot123
      LLM_GATEWAY_URL: http://higress:8080
      SKILL_NAME: postmortem-capture
    depends_on:
      - manager
