      MATRIX_HOMESERVER: http://synapse:8008
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: devpilot
      MINIO_PASSWORD: devpilot123
      LLM_GATEWAY_URL: http://higress:8080
      SKILL_NAME: canary-release
    depends_on:
      - manager
      - synapse
      - minio
    networks:
      - devpilot-network
