name: CI - DevPilot Loop

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e "skills[dev]"

    - name: Run linter
      run: |
        python -m py_compile poc/deploy/runtime/agent_runtime.py
        python -m py_compile skills/base.py
        python -m py_compile skills/registry.py

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: pytest-results/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run security scan
      run: |
        pip install bandit safety
        bandit -r skills/ poc/ --skip B101
        safety check --json 2>/dev/null || true

    - name: Check for secrets
      run: |
        if grep -r "password\|secret\|api_key" --include="*.py" --exclude-dir=".git" . | grep -v "test\|example"; then
          echo "WARNING: Potential secrets found in code"
        fi

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker compose build --no-cache

    - name: Run container tests
      run: |
        docker compose up -d
        sleep 10
        curl -f http://localhost:8008/health || exit 1
        docker compose down

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check documentation
      run: |
        echo "Documentation files:"
        ls docs/*.md
        echo "Evidence files:"
        ls poc/evidence/
        echo "Slide assets:"
        ls slides/assets/*.png 2>/dev/null || true

  deploy-demo:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, security]
    steps:
    - uses: actions/checkout@v4

    - name: Generate demo presentation
      run: |
        cd slides
        python3 generate_ppt.py || echo "PPT generation skipped"

    - name: Generate evidence
      run: |
        cd poc/evidence
        python3 generate_screenshots.py 2>/dev/null || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: competition-assets
        path: |
          slides/*.pptx
          poc/evidence/**/*.png
          docs/*.md
          README.md
