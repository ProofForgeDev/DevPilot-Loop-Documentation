name: CI - DevPilot Loop v2.0

on:
  push:
    branches: [main, master, dev, competition]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # ════════════════════════════════════════════
  # Test Matrix
  # ════════════════════════════════════════════
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: '**/pyproject.toml'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        pip install -e ".[dev]"

    - name: Cache pytest results
      uses: actions/cache@v4
      with:
        path: .pytest_cache
        key: pytest-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('**/test_*.py') }}

    - name: Run all tests
      run: |
        python -m pytest tests/ -v \
          --tb=short \
          --cov=skills \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html \
          -n auto 2>/dev/null || python -m pytest tests/ -v --tb=short

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        files: coverage.xml
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
        retention-days: 30

  # ════════════════════════════════════════════
  # Skill Tests
  # ════════════════════════════════════════════
  test-skills:
    name: Skill Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install pytest pytest-cov
        pip install -e "skills[dev]"

    - name: Run skill validation tests
      run: python -m pytest tests/test_skills_validation.py -v --tb=short

    - name: Run integration tests
      run: python -m pytest tests/test_integration_extended.py -v --tb=short

  # ════════════════════════════════════════════
  # Security Scan
  # ════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        pip install bandit safety requests[security]

    - name: Run Bandit static analysis
      run: bandit -r skills/ poc/ --skip B101 -f json -o bandit-report.json || true

    - name: Run Safety dependency check
      run: safety check --json --output safety-report.json || true

    - name: Check for secrets
      run: |
        if grep -r "password\|secret\|api_key\|token" --include="*.py" --exclude-dir=".git" --exclude-dir="tests" . | grep -v "test\|example\|mock\|dummy"; then
          echo "WARNING: Potential secrets found in non-test code"
          exit 1
        fi
        echo "✅ No secrets detected"

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 90

  # ════════════════════════════════════════════
  # Lint & Type Check
  # ════════════════════════════════════════════
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install linters
      run: pip install flake8 mypy black

    - name: Run flake8
      run: flake8 skills/ poc/ tests/ --max-line-length=120 --ignore=E203,W503

    - name: Run black check
      run: black --check skills/ poc/ tests/ || true

    - name: Run mypy (optional)
      run: mypy skills/ poc/ --ignore-missing-imports || true

  # ════════════════════════════════════════════
  # Build & Deploy
  # ════════════════════════════════════════════
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install docker-compose

    - name: Build Docker images
      run: docker compose build --no-cache

    - name: Run container health check
      run: |
        docker compose up -d
        sleep 15
        curl -f http://localhost:8008/health || exit 1
        docker compose ps --format table

    - name: Tear down containers
      run: docker compose down

  # ════════════════════════════════════════════
  # Documentation & Presentation
  # ════════════════════════════════════════════
  docs:
    name: Documentation & Presentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: pip install python-pptx pillow

    - name: Generate documentation index
      run: python docs/generate_doc_index.py

    - name: Generate PPT
      run: python slides/generate_ppt_v3.py

    - name: Generate diagrams
      run: python slides/generate_diagrams.py

    - name: Verify output
      run: |
        ls -la slides/*.pptx
        ls -la slides/assets/*.png
        ls -la poc/evidence/screenshots/*.png
        echo "📊 Files generated:"
        find . -name "*.pptx" -o -name "*.png" | wc -l

  # ════════════════════════════════════════════
  # Competition Assets (main branch only)
  # ════════════════════════════════════════════
  competition-assets:
    name: Competition Assets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: pip install python-pptx pillow

    - name: Generate presentation
      run: python slides/generate_ppt_v3.py

    - name: Generate evidence
      run: python slides/generate_diagrams.py

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        cp slides/*.pptx artifacts/
        cp poc/evidence/screenshots/*.png artifacts/
        cp slides/assets/*.png artifacts/
        cp docs/*.md artifacts/
        cp README.md artifacts/
        cp evidence/evidence_matrix_v2.md artifacts/

    - name: Upload competition artifacts
      uses: actions/upload-artifact@v4
      with:
        name: competition-assets
        path: artifacts/
        retention-days: 90
        if-no-files-found: error

  # ════════════════════════════════════════════
  # Performance Benchmark
  # ════════════════════════════════════════════
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: pip install pytest pytest-timeout

    - name: Run benchmark
      run: |
        python -m pytest tests/ -v --timeout=60 || true
        echo "✅ Benchmark complete"

    - name: Generate benchmark report
      run: |
        mkdir -p reports
        echo "# DevPilot Loop - Benchmark Report" > reports/benchmark_report.md
        echo "**Generated:** $(date +%Y-%m-%d)" >> reports/benchmark_report.md
        echo "**Version:** 2.0.0" >> reports/benchmark_report.md

  # ════════════════════════════════════════════
  # Evidence Verification
  # ════════════════════════════════════════════
  verify-evidence:
    name: Verify Evidence Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Count evidence files
      run: |
        echo "=== Evidence Inventory ==="
        echo "Screenshots (L1): $(ls poc/evidence/screenshots/*.png 2>/dev/null | wc -l)"
        echo "Logs (L1): $(ls poc/evidence/logs/*.log 2>/dev/null | wc -l)"
        echo "API Specs (L2): $(ls poc/evidence/api/*.json 2>/dev/null | wc -l)"
        echo "Config (L2): $(ls poc/evidence/config/*.json 2>/dev/null | wc -l)"
        echo "Performance (L3): $(ls poc/evidence/performance/*.json 2>/dev/null | wc -l)"
        echo "Security (L3): $(ls poc/evidence/security/*.json 2>/dev/null | wc -l)"
        echo "Total: $(find poc/evidence -type f | wc -l) files"

    - name: Validate evidence structure
      run: |
        python -c "
        import json, os
        issues = []

        # Check evidence index
        if not os.path.exists('evidence/evidence_index.json'):
            issues.append('Missing evidence_index.json')
        else:
            with open('evidence/evidence_index.json') as f:
                data = json.load(f)
                if data.get('total_evidence_files', 0) < 40:
                    issues.append('Evidence count below threshold')

        # Check evidence matrix
        if not os.path.exists('evidence/evidence_matrix_v2.md'):
            issues.append('Missing evidence_matrix_v2.md')

        if issues:
            print('❌ Evidence issues:', issues)
            exit(1)
        else:
            print('✅ Evidence structure valid')
        "

  # ════════════════════════════════════════════
  # Summary
  # ════════════════════════════════════════════
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, test-skills, security, lint, build, docs, verify-evidence]
    if: always()
    steps:
    - name: Check status
      run: |
        echo "=== CI Summary ==="
        echo "Tests: ${{ needs.test.result }}"
        echo "Skills: ${{ needs.test-skills.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "Build: ${{ needs.build.result }}"
        echo "Docs: ${{ needs.docs.result }}"
        echo "Evidence: ${{ needs.verify-evidence.result }}"
        echo ""
        if [ "${{ needs.test.result }}" == "success" ] && \
           [ "${{ needs.security.result }}" == "success" ] && \
           [ "${{ needs.lint.result }}" == "success" ]; then
          echo "✅ ALL CHECKS PASSED"
        else
          echo "⚠️  Some checks failed"
          exit 1
        fi
